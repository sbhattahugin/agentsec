[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec"
version = "0.1.0"
description = "AgentSec PoC - discover, attack and gate AI agents"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentsec = "agentsec.cli:main"

[tool.setuptools]
packages = ["agentsec", "agentsec.adapters"]

[tool.setuptools.package-data]
agentsec = ["attacks.yaml", "policies/*.yaml"]
